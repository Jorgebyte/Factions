name: CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, pdo, sqlite3, curl, json
          tools: composer:v2, php-cs-fixer
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      - name: Check Code Style (PHP-CS-Fixer)
        run: php-cs-fixer fix --dry-run --diff --verbose

      - name: Download Virions for Analysis
        run: |
          mkdir -p .virions
          curl -sL https://poggit.pmmp.io/r/216503/Commando.phar -o .virions/Commando.phar
          curl -sL https://poggit.pmmp.io/r/214300/libasynql.phar -o .virions/libasynql.phar
          curl -sL https://poggit.pmmp.io/r/198754/libPiggyEconomy.phar -o .virions/libPiggyEconomy.phar
          curl -sL https://poggit.pmmp.io/r/213567/languages.phar -o .virions/languages.phar

      - name: Static Analysis (PHPStan)
        run: vendor/bin/phpstan analyze --no-progress

      - name: Run Tests (PHPUnit)
        run: vendor/bin/phpunit
